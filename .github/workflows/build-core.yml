name: Build ST core

# Builds the single-threaded ffmpeg.wasm core used by StickerProcess
# (https://github.com/TheFunny/StickerProcess) and publishes it as a release asset.
#
# Differences from upstream's `make prd`: libvpx is built with
# --enable-vp9-highbitdepth (see build/libvpx.sh), the wasm goes through
# wasm-opt -Oz, and the result is smoke-tested in headless Chromium before it is
# published. The consuming repo pins the sha256 of the published assets.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. st-core-v1). Empty = build only."
        required: false
        default: ""
  push:
    branches: [st-core]
    paths:
      - "build/**"
      - "src/bind/**"
      - "src/fftools/**"
      - "Dockerfile"
      - "Makefile"
      - "test/smoke/**"
      - ".github/workflows/build-core.yml"

permissions:
  contents: write

env:
  EMSDK_IMAGE: emscripten/emsdk:3.1.40
  BINARYEN: version_132

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # The 16-stage build plus the apt/binaryen downloads do not fit in the
      # stock 14 GB of free disk space.
      - name: Reclaim disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # Guards the whole point of this fork: without it the core silently falls
      # back to 8-bit VP9 for MP4 inputs.
      - name: Assert the highbitdepth patch is applied
        run: grep -q -- '--enable-vp9-highbitdepth' build/libvpx.sh

      - uses: docker/setup-buildx-action@v3

      # Layer cache keyed on the build inputs (upstream does the same): the
      # static-library stages are reused until Dockerfile/Makefile/build scripts
      # change, so a rebuild only recompiles the affected stage and everything
      # downstream of it.
      - name: Restore build layers
        uses: actions/cache@v4
        with:
          path: build-cache
          key: core-st-${{ hashFiles('Dockerfile', 'Makefile', 'build/*') }}
          restore-keys: core-st-

      - name: Build core
        run: |
          # `-o .`: the final Dockerfile stage is `FROM scratch AS exportor`
          # copying /src/dist, so the exported tree is ./dist/umd/... (this is
          # what upstream's Makefile does with `-o ./packages/core`).
          docker buildx build \
            --build-arg FFMPEG_ST=yes \
            --build-arg EXTRA_CFLAGS="-O3 -msimd128" \
            --cache-from=type=local,src=build-cache \
            --cache-to=type=local,dest=build-cache,mode=max \
            -o . .
          test -s dist/umd/ffmpeg-core.wasm || { ls -R dist | head -50; exit 1; }
          ls -l dist/umd

      - name: Shrink the wasm with wasm-opt -Oz
        run: |
          tgz="binaryen-${BINARYEN}-x86_64-linux.tar.gz"
          base="https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN}"
          curl -fsSLO "$base/$tgz"
          curl -fsSLO "$base/$tgz.sha256"
          expected=$(awk '{print $1}' "$tgz.sha256" | head -1)
          actual=$(sha256sum "$tgz" | awk '{print $1}')
          [ -n "$expected" ] && [ "$expected" = "$actual" ] || {
            echo "::error::binaryen tarball checksum mismatch"; exit 1; }
          tar xzf "$tgz"

          mkdir -p out
          cp dist/umd/ffmpeg-core.js out/ffmpeg-core-st.js
          "./binaryen-${BINARYEN}/bin/wasm-opt" -Oz --strip-debug \
            dist/umd/ffmpeg-core.wasm -o out/ffmpeg-core-st.wasm
          ls -l out

      - name: Assert the output shape
        run: |
          python3 - <<'PY'
          import pathlib
          wasm = pathlib.Path("out/ffmpeg-core-st.wasm").read_bytes()
          assert wasm[:4] == b"\0asm", "output is not a wasm module"
          # wasm-opt -Oz lands at ~29.5 MB from a ~33.2 MB raw build; anything
          # outside this band means the pipeline changed silently.
          assert 25_000_000 < len(wasm) < 33_000_000, f"unexpected wasm size {len(wasm)}"
          loader = pathlib.Path("out/ffmpeg-core-st.js").read_text(encoding="utf-8")
          assert len(loader) > 50_000, f"loader looks truncated ({len(loader)} bytes)"
          print(f"wasm {len(wasm)} bytes, loader {len(loader)} bytes")
          PY

      # Loading the core through the same wrapper the web app ships keeps this a
      # real ABI check, not just a shape check.
      - name: Smoke test in headless Chromium
        run: |
          cd test/smoke
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node run.mjs

      - name: Record hashes
        run: |
          cd out
          sha256sum ffmpeg-core-st.js ffmpeg-core-st.wasm | tee ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core-st
          path: |
            out/ffmpeg-core-st.js
            out/ffmpeg-core-st.wasm
            SHA256SUMS.txt

      - name: Publish release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          NOTES=$(printf '%s\n' \
            "Self-built ffmpeg.wasm ST core for StickerProcess." \
            "" \
            "- upstream: https://github.com/ffmpegwasm/ffmpeg.wasm @ $(git rev-parse HEAD)" \
            "- emsdk: ${EMSDK_IMAGE}, binaryen: ${BINARYEN}" \
            "- build: FFMPEG_ST=yes, EXTRA_CFLAGS=\"-O3 -msimd128\", wasm-opt -Oz" \
            "- libvpx: --enable-vp9-highbitdepth (this fork's only source change)" \
            "- smoke tested in headless Chromium (GIF alpha + 10-bit VP9)" \
            "" \
            "\`\`\`" \
            "$(cat SHA256SUMS.txt)" \
            "\`\`\`" \
            "" \
            "FFmpeg is GPL v3 (built with --enable-gpl, x264/x265):" \
            "source for this binary is this repository plus the upstream commit above.")
          gh release view "$TAG" >/dev/null 2>&1 \
            && gh release upload "$TAG" out/ffmpeg-core-st.js out/ffmpeg-core-st.wasm SHA256SUMS.txt --clobber \
            || gh release create "$TAG" out/ffmpeg-core-st.js out/ffmpeg-core-st.wasm SHA256SUMS.txt \
                 --title "ffmpeg.wasm ST core $TAG" --notes "$NOTES"
